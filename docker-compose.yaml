services:

  redis:
    image: redis:7-alpine
    networks:
      - rl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  rl1:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "9091"
    environment:
      PORT: 8080
      METRICS_PORT: 9091
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT: 50
      WINDOW: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rl-network
    restart: unless-stopped

  rl2:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "9091"
    environment:
      PORT: 8080
      METRICS_PORT: 9091
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT: 50
      WINDOW: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rl-network
    restart: unless-stopped

  rl3:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
      - "9091"
    environment:
      PORT: 8080
      METRICS_PORT: 9091
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT: 50
      WINDOW: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rl-network
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    networks:
      - rl-network
    restart: unless-stopped
    
    volumes:
     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - rl1
      - rl2
      - rl3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rl1
      - rl2
      - rl3
    networks:
      - rl-network
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - rl-network
    restart: unless-stopped


networks:
  rl-network:
    driver: bridge